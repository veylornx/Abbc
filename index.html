<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24C — Timeless Essentials</title>
<meta name="description" content="24C crafts timeless clothing in premium fabrics. Minimal design, considered details, made to last.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   24C DESIGN SYSTEM
   ============================================================ */
:root {
  --ink: #181818;
  --bg: #FAF9F6;
  --surface: #FFFFFF;
  --beige: #E8E2D9;
  --beige-deep: #D6CEC2;
  --muted: #8A857D;
  --line: #E4E1DB;
  --danger: #A14A3A;
  --success: #3E5A4A;

  --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  --max: 1280px;
  --gutter: 24px;
  --ease: cubic-bezier(0.455, 0.03, 0.515, 0.955);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }

h1, h2, h3, h4 {
  font-family: var(--serif);
  font-weight: 400;
  line-height: 1.15;
  letter-spacing: 0.01em;
}

.container { max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* ---------- BUTTONS ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 10px; padding: 14px 32px;
  font-family: var(--sans); font-size: 11px; font-weight: 500;
  letter-spacing: 0.14em; text-transform: uppercase;
  border: 1px solid var(--ink); background: var(--ink); color: var(--bg);
  transition: background 0.25s var(--ease), color 0.25s var(--ease), border-color 0.25s var(--ease);
  min-height: 48px;
}
.btn:hover { background: transparent; color: var(--ink); }
.btn--outline { background: transparent; color: var(--ink); }
.btn--outline:hover { background: var(--ink); color: var(--bg); }
.btn--light { background: var(--bg); color: var(--ink); border-color: var(--bg); }
.btn--light:hover { background: transparent; color: var(--bg); }
.btn--full { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* ---------- HEADER ---------- */
.site-header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(250,249,246,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.header-inner {
  max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter);
  height: 72px; display: flex; align-items: center; justify-content: space-between;
}
.logo {
  font-family: var(--serif); font-size: 26px; font-weight: 500;
  letter-spacing: 0.18em; text-transform: uppercase;
}
.nav-links { display: flex; gap: 32px; align-items: center; }
.nav-links a {
  font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
  font-weight: 500; color: var(--ink); position: relative; padding: 4px 0;
}
.nav-links a::after {
  content: ''; position: absolute; left: 0; bottom: 0;
  width: 0; height: 1px; background: var(--ink);
  transition: width 0.3s var(--ease);
}
.nav-links a:hover::after, .nav-links a.active::after { width: 100%; }

.header-actions { display: flex; align-items: center; gap: 20px; }
.icon-btn {
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  font-weight: 500; display: flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 0 4px;
}
.cart-count {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 4px;
  background: var(--ink); color: var(--bg);
  font-size: 9px; border-radius: 50%; font-weight: 600;
}
.menu-toggle { display: none; flex-direction: column; gap: 5px; padding: 10px; }
.menu-toggle span { display: block; width: 22px; height: 1px; background: var(--ink); transition: 0.3s; }

/* ---------- HERO ---------- */
.hero {
  position: relative; min-height: 78vh;
  display: flex; align-items: flex-end;
  background: var(--beige);
  overflow: hidden;
}
.hero-bg {
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(24,24,24,0.10) 0%, rgba(24,24,24,0.45) 100%),
    url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=1800&q=80') center/cover no-repeat;
}
.hero-content {
  position: relative; z-index: 1;
  max-width: var(--max); margin: 0 auto; width: 100%;
  padding: 0 var(--gutter) 72px;
  color: #fff;
}
.hero-eyebrow {
  font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
  margin-bottom: 18px; opacity: 0.9;
}
.hero h1 {
  font-size: clamp(42px, 7vw, 82px);
  font-weight: 300; max-width: 680px;
  letter-spacing: 0.02em; line-height: 1.05;
  margin-bottom: 28px;
}
.hero p {
  max-width: 440px; font-size: 14px; font-weight: 300;
  line-height: 1.75; opacity: 0.88; margin-bottom: 36px;
}

/* ---------- SECTION ---------- */
.section { padding: 96px 0; }
.section--tight { padding: 64px 0; }
.section-header {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 24px; margin-bottom: 48px; flex-wrap: wrap;
}
.section-header h2 { font-size: clamp(30px, 4vw, 46px); font-weight: 300; }
.section-eyebrow {
  font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 10px;
}
.link-arrow {
  font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
  font-weight: 500; border-bottom: 1px solid var(--ink); padding-bottom: 3px;
}

/* ---------- PRODUCT GRID ---------- */
.product-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 32px 24px;
}
.product-card { position: relative; cursor: pointer; }
.product-media {
  position: relative; aspect-ratio: 3/4;
  background: var(--beige); overflow: hidden;
  margin-bottom: 16px;
}
.product-media img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.7s var(--ease), opacity 0.3s;
}
.product-card:hover .product-media img { transform: scale(1.04); }
.product-badge {
  position: absolute; top: 12px; left: 12px;
  font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
  background: var(--bg); color: var(--ink);
  padding: 5px 10px; font-weight: 500;
}
.quick-add {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: rgba(24,24,24,0.92); color: var(--bg);
  text-align: center; padding: 14px;
  font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
  transform: translateY(100%);
  transition: transform 0.35s var(--ease);
}
.product-card:hover .quick-add { transform: translateY(0); }
.product-info { display: flex; flex-direction: column; gap: 4px; }
.product-name { font-size: 13px; font-weight: 500; letter-spacing: 0.02em; }
.product-category { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.product-price { font-size: 13px; font-weight: 500; margin-top: 2px; }
.product-price s { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 12px; }
.product-card .stock-note { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* ---------- COLLECTION STRIP ---------- */
.collection-grid {
  display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 20px;
}
.collection-card {
  position: relative; min-height: 420px;
  background: var(--beige); overflow: hidden;
  display: flex; align-items: flex-end; padding: 28px;
}
.collection-card::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 40%, rgba(24,24,24,0.55) 100%);
  z-index: 1;
}
.collection-card img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; transition: transform 0.7s var(--ease);
}
.collection-card:hover img { transform: scale(1.04); }
.collection-card-content { position: relative; z-index: 2; color: #fff; }
.collection-card-content h3 { font-size: 26px; font-weight: 300; margin-bottom: 12px; }

/* ---------- PROMO BANNER ---------- */
.promo {
  background: var(--ink); color: var(--bg);
  padding: 72px var(--gutter); text-align: center;
}
.promo h2 { font-size: clamp(28px, 4vw, 48px); font-weight: 300; margin-bottom: 16px; }
.promo p { font-size: 13px; font-weight: 300; opacity: 0.75; max-width: 520px; margin: 0 auto 32px; }

/* ---------- NEWSLETTER ---------- */
.newsletter { padding: 96px 0; background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.newsletter-inner { max-width: 560px; margin: 0 auto; text-align: center; }
.newsletter h2 { font-size: 38px; font-weight: 300; margin-bottom: 12px; }
.newsletter p { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
.newsletter-form { display: flex; border-bottom: 1px solid var(--ink); }
.newsletter-form input {
  flex: 1; border: none; background: transparent; padding: 12px 4px;
  font-size: 13px; outline: none;
}
.newsletter-form button {
  font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
  font-weight: 600; padding: 0 8px;
}

/* ---------- FOOTER ---------- */
.site-footer { background: var(--ink); color: var(--bg); padding: 72px 0 32px; }
.footer-grid {
  display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 48px;
  padding-bottom: 56px; border-bottom: 1px solid rgba(250,249,246,0.15);
}
.footer-brand .logo { color: var(--bg); margin-bottom: 16px; display: block; }
.footer-brand p { font-size: 12px; font-weight: 300; opacity: 0.65; max-width: 280px; line-height: 1.8; }
.footer-col h4 {
  font-family: var(--sans); font-size: 10px; letter-spacing: 0.2em;
  text-transform: uppercase; font-weight: 500; margin-bottom: 20px; opacity: 0.5;
}
.footer-col a { display: block; font-size: 12px; font-weight: 300; opacity: 0.8; margin-bottom: 10px; transition: opacity 0.2s; }
.footer-col a:hover { opacity: 1; }
.footer-bottom { padding-top: 28px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.footer-bottom p { font-size: 10px; letter-spacing: 0.08em; opacity: 0.45; }

/* ---------- PAGE HEADER ---------- */
.page-header { padding: 72px 0 40px; border-bottom: 1px solid var(--line); }
.page-header h1 { font-size: clamp(34px, 5vw, 56px); font-weight: 300; }
.page-header p { font-size: 13px; color: var(--muted); max-width: 520px; margin-top: 12px; }

/* ---------- SHOP LAYOUT ---------- */
.shop-layout { display: grid; grid-template-columns: 240px 1fr; gap: 48px; padding: 56px 0 96px; }
.filter-group { margin-bottom: 32px; }
.filter-group h4 {
  font-family: var(--sans); font-size: 10px; letter-spacing: 0.18em;
  text-transform: uppercase; font-weight: 600; margin-bottom: 14px;
}
.filter-group label {
  display: flex; align-items: center; gap: 10px;
  font-size: 12px; color: var(--muted); margin-bottom: 10px; cursor: pointer;
}
.filter-group input[type="checkbox"] { accent-color: var(--ink); width: 14px; height: 14px; }
.price-inputs { display: flex; gap: 8px; align-items: center; }
.price-inputs input {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line);
  background: var(--surface); font-size: 12px; outline: none;
}
.shop-toolbar {
  display: flex; justify-content: space-between; align-items: center;
  gap: 16px; margin-bottom: 28px; flex-wrap: wrap;
}
.search-box {
  display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid var(--ink); padding: 8px 4px; flex: 1; min-width: 200px; max-width: 340px;
}
.search-box input { border: none; background: transparent; outline: none; font-size: 13px; width: 100%; }
.sort-select {
  border: 1px solid var(--line); background: var(--surface);
  padding: 10px 14px; font-size: 11px; letter-spacing: 0.06em; outline: none;
}

/* ---------- PRODUCT DETAIL ---------- */
.product-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; padding: 56px 0 96px; }
.gallery-main { aspect-ratio: 3/4; background: var(--beige); overflow: hidden; margin-bottom: 12px; }
.gallery-main img { width: 100%; height: 100%; object-fit: cover; }
.gallery-thumbs { display: flex; gap: 10px; }
.gallery-thumbs button {
  width: 72px; height: 96px; background: var(--beige); overflow: hidden;
  border: 1px solid transparent; padding: 0;
}
.gallery-thumbs button.active { border-color: var(--ink); }
.gallery-thumbs img { width: 100%; height: 100%; object-fit: cover; }
.detail-info .product-category { margin-bottom: 12px; }
.detail-info h1 { font-size: clamp(30px, 4vw, 44px); font-weight: 300; margin-bottom: 16px; }
.detail-price { font-size: 20px; font-weight: 500; margin-bottom: 24px; }
.detail-desc { font-size: 13px; color: var(--muted); line-height: 1.85; margin-bottom: 32px; max-width: 480px; }
.option-label {
  font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
  font-weight: 600; margin-bottom: 12px; display: block;
}
.size-options { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
.size-btn {
  min-width: 48px; height: 44px; padding: 0 14px;
  border: 1px solid var(--line); font-size: 11px; letter-spacing: 0.06em;
  transition: border-color 0.2s, background 0.2s;
}
.size-btn:hover { border-color: var(--ink); }
.size-btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.size-btn:disabled { opacity: 0.3; cursor: not-allowed; text-decoration: line-through; }
.color-options { display: flex; gap: 10px; margin-bottom: 28px; flex-wrap: wrap; }
.color-btn {
  padding: 8px 16px; border: 1px solid var(--line);
  font-size: 11px; letter-spacing: 0.04em; transition: 0.2s;
}
.color-btn.active { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.qty-row { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
.qty-control { display: flex; align-items: center; border: 1px solid var(--line); }
.qty-control button { width: 42px; height: 42px; font-size: 16px; }
.qty-control span { min-width: 36px; text-align: center; font-size: 13px; }
.detail-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.detail-actions .btn { flex: 1; min-width: 160px; }
.detail-meta { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); line-height: 2; }

/* ---------- CART ---------- */
.cart-layout { display: grid; grid-template-columns: 1fr 380px; gap: 48px; padding: 56px 0 96px; align-items: start; }
.cart-item {
  display: grid; grid-template-columns: 96px 1fr auto; gap: 20px;
  padding: 24px 0; border-bottom: 1px solid var(--line); align-items: center;
}
.cart-item img { width: 96px; height: 120px; object-fit: cover; background: var(--beige); }
.cart-item-info h3 { font-family: var(--sans); font-size: 13px; font-weight: 500; margin-bottom: 4px; }
.cart-item-info p { font-size: 11px; color: var(--muted); }
.cart-item-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.remove-btn { font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; border-bottom: 1px solid var(--muted); }
.summary-box { background: var(--surface); border: 1px solid var(--line); padding: 28px; position: sticky; top: 96px; }
.summary-box h3 { font-size: 22px; font-weight: 300; margin-bottom: 20px; }
.summary-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 12px; }
.summary-row.total { font-weight: 600; font-size: 16px; padding-top: 16px; border-top: 1px solid var(--line); margin-top: 16px; }
.empty-state { text-align: center; padding: 96px 24px; }
.empty-state h2 { font-size: 32px; font-weight: 300; margin-bottom: 12px; }
.empty-state p { font-size: 13px; color: var(--muted); margin-bottom: 28px; }

/* ---------- CHECKOUT ---------- */
.checkout-layout { display: grid; grid-template-columns: 1fr 400px; gap: 64px; padding: 56px 0 96px; align-items: start; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.form-field { display: flex; flex-direction: column; gap: 6px; }
.form-field.full { grid-column: 1 / -1; }
.form-field label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
.form-field input, .form-field select, .form-field textarea {
  padding: 13px 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 13px; outline: none; transition: border-color 0.2s;
}
.form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: var(--ink); }
.form-field textarea { resize: vertical; min-height: 90px; }
.form-field.error input, .form-field.error select, .form-field.error textarea { border-color: var(--danger); }
.error-msg { font-size: 10px; color: var(--danger); display: none; }
.form-field.error .error-msg { display: block; }
.radio-card {
  display: flex; gap: 12px; align-items: flex-start;
  border: 1px solid var(--line); padding: 16px; margin-bottom: 10px; cursor: pointer;
}
.radio-card.selected { border-color: var(--ink); }
.radio-card input { margin-top: 3px; accent-color: var(--ink); }

/* ---------- ORDER CONFIRM ---------- */
.confirm-wrap { max-width: 640px; margin: 0 auto; padding: 96px 24px; text-align: center; }
.confirm-mark {
  width: 56px; height: 56px; border: 1px solid var(--ink); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 28px; font-size: 22px;
}
.confirm-wrap h1 { font-size: 40px; font-weight: 300; margin-bottom: 12px; }
.confirm-wrap > p { font-size: 13px; color: var(--muted); margin-bottom: 36px; }
.confirm-card { border: 1px solid var(--line); background: var(--surface); padding: 28px; text-align: left; margin-bottom: 28px; }
.confirm-card .summary-row { font-size: 12px; }

/* ---------- CONTENT PAGES ---------- */
.content-page { max-width: 760px; margin: 0 auto; padding: 72px 24px 96px; }
.content-page h1 { font-size: clamp(34px, 5vw, 52px); font-weight: 300; margin-bottom: 8px; }
.content-page .lead { font-size: 14px; color: var(--muted); margin-bottom: 40px; }
.content-page h2 { font-size: 24px; font-weight: 400; margin: 36px 0 12px; }
.content-page p, .content-page li { font-size: 13px; line-height: 1.9; color: #3a3a3a; }
.content-page ul { padding-left: 20px; margin: 10px 0; }
.content-page a { border-bottom: 1px solid var(--ink); }
.faq-item { border-bottom: 1px solid var(--line); padding: 22px 0; }
.faq-item summary {
  font-size: 14px; font-weight: 500; cursor: pointer; list-style: none;
  display: flex; justify-content: space-between; gap: 16px;
}
.faq-item summary::-webkit-details-marker { display: none; }
.faq-item summary::after { content: '+'; font-weight: 300; font-size: 18px; }
.faq-item[open] summary::after { content: '−'; }
.faq-item p { margin-top: 14px; font-size: 13px; color: var(--muted); line-height: 1.85; }

/* ---------- ADMIN ---------- */
.admin-shell { min-height: 100vh; background: #F4F2EE; }
.admin-header {
  background: var(--ink); color: var(--bg); padding: 0 var(--gutter);
  display: flex; align-items: center; justify-content: space-between;
  height: 60px; position: sticky; top: 0; z-index: 50;
}
.admin-header .logo { font-size: 20px; color: var(--bg); }
.admin-nav { display: flex; gap: 4px; flex-wrap: wrap; }
.admin-nav button {
  color: rgba(250,249,246,0.6); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; padding: 8px 14px; border-radius: 0;
  transition: 0.2s;
}
.admin-nav button.active, .admin
